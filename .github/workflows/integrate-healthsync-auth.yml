name: Integrate HealthSync authentication

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate-auth:
    if: \${{ !contains(github.event.head_commit.message, '[healthsync-auth]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach authentication layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Health_tech_saas.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="auth.js"></script>'
          if tag not in s:
              s = s.replace('</body>', '    ' + tag + '\n</body>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name "HealthSync Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Health_tech_saas.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[healthsync-auth] Attach functional authentication layer"
          git push
