<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HealthSync</title>
  <style>
    html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#f8f9fc}
    iframe{display:block}
  </style>
</head>
<body>
  <iframe id="healthsync-app" src="Health_tech_saas.html" title="HealthSync"></iframe>
  <script>
    const frame = document.getElementById('healthsync-app');
    frame.addEventListener('load', () => {
      try {
        const doc = frame.contentDocument;
        if (!doc.querySelector('script[src="auth.js"]')) {
          const script = doc.createElement('script');
          script.src = 'auth.js';
          doc.body.appendChild(script);
        }
      } catch (e) {
        console.error('HealthSync authentication bootstrap failed:', e);
      }
    });
  </script>
</body>
</html>
